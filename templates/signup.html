<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HomeMade Pickles & Snacks</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables */
        :root {
            --primary-green: #4C7244;
            --dark-green: #3A5A35;
            --light-green: #6B8E23;
            --gold: #FFD700;
            --cream: #f8f1e4;
            --white: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --shadow-light: rgba(76, 114, 68, 0.15);
            --shadow-medium: rgba(76, 114, 68, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f1e4 0%, #fff5e6 50%, #f0e6d3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Background Elements */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.08;
            animation: float 20s infinite ease-in-out;
        }

        .floating-shape:nth-child(1) {
            top: 10%;
            left: 5%;
            font-size: 80px;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            top: 70%;
            left: 10%;
            font-size: 60px;
            animation-delay: -5s;
        }

        .floating-shape:nth-child(3) {
            top: 20%;
            right: 10%;
            font-size: 70px;
            animation-delay: -10s;
        }

        .floating-shape:nth-child(4) {
            bottom: 20%;
            right: 5%;
            font-size: 55px;
            animation-delay: -15s;
        }

        .floating-shape:nth-child(5) {
            top: 50%;
            left: 2%;
            font-size: 45px;
            animation-delay: -8s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-20px) rotate(5deg);
            }
            50% {
                transform: translateY(0) rotate(0deg);
            }
            75% {
                transform: translateY(20px) rotate(-5deg);
            }
        }

        /* Main Container */
        .signup-wrapper {
            display: flex;
            width: 900px;
            max-width: 95%;
            height: 600px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 25px 60px var(--shadow-medium);
            overflow: hidden;
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Left Side - Branding Panel */
        .brand-panel {
            flex: 1;
            background: linear-gradient(145deg, var(--primary-green) 0%, var(--dark-green) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .brand-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: var(--white);
        }

        .brand-icon {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            }
        }

        .brand-icon i {
            font-size: 50px;
            color: var(--gold);
        }

        .brand-panel h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .brand-panel p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .brand-decoration {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .brand-decoration span {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .brand-decoration span:hover {
            background: var(--gold);
            color: var(--primary-green);
            transform: translateY(-5px);
        }

        /* Right Side - Form Panel */
        .form-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 50px;
            background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
            position: relative;
            overflow-y: auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-green);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Input Groups */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-green);
            font-size: 1.1rem;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: var(--white);
            color: var(--text-dark);
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(76, 114, 68, 0.1);
            transform: translateY(-2px);
        }

        .input-group input:focus + i,
        .input-group:focus-within i {
            color: var(--dark-green);
            transform: translateY(-50%) scale(1.1);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            color: var(--white);
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(76, 114, 68, 0.3);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #999;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            background: var(--white);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .social-btn:hover {
            border-color: var(--primary-green);
            background: rgba(76, 114, 68, 0.05);
            transform: translateY(-2px);
        }

        .social-btn.google:hover {
            border-color: #DB4437;
            color: #DB4437;
        }

        .social-btn.facebook:hover {
            border-color: #4267B2;
            color: #4267B2;
        }

        /* Error Message */
        .error-message {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            color: #c62828;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.95rem;
            border-left: 4px solid #c62828;
            animation: shake 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Link */
        .form-footer {
            text-align: center;
            margin-top: 20px;
        }

        .form-footer a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .form-footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-green);
            transition: width 0.3s ease;
        }

        .form-footer a:hover::after {
            width: 100%;
        }

        .form-footer a:hover {
            color: var(--dark-green);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .signup-wrapper {
                flex-direction: column;
                height: auto;
                width: 95%;
                max-width: 450px;
                padding-bottom: 20px;
            }

            .brand-panel {
                padding: 30px;
                min-height: 200px;
            }

            .brand-icon {
                width: 80px;
                height: 80px;
                margin-bottom: 15px;
            }

            .brand-icon i {
                font-size: 35px;
            }

            .brand-panel h1 {
                font-size: 1.5rem;
            }

            .form-panel {
                padding: 35px 25px;
            }

            .floating-shape {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="floating-shape">🥒</div>
        <div class="floating-shape">🌶️</div>
        <div class="floating-shape">🍋</div>
        <div class="floating-shape">🍯</div>
        <div class="floating-shape">🥭</div>
    </div>

    <div class="signup-wrapper">
        <!-- Left Side - Brand Panel -->
        <div class="brand-panel">
            <div class="brand-content">
                <div class="brand-icon">
                    <i class="fas fa-jar"></i>
                </div>
                <h1>Join Our Family</h1>
                <p>Discover authentic homemade flavors</p>
                <div class="brand-decoration">
                    <span>🥒</span>
                    <span>🌶️</span>
                    <span>🫑</span>
                    <span>🍋</span>
                </div>
            </div>
        </div>

        <!-- Right Side - Form Panel -->
        <div class="form-panel">
            <div class="form-header">
                <h2>Create Account</h2>
                <p>Start your journey with us today</p>
            </div>

            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('signup') }}" method="POST">
                <div class="input-group">
                    <input type="text" name="username" placeholder="Choose Username" required>
                    <i class="fas fa-user"></i>
                </div>
                <div class="input-group">
                    <input type="email" name="email" placeholder="Email Address" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Create Password" required>
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-login">
                <button class="social-btn google">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn facebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
            </div>

            <div class="form-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
